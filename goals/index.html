<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goals</title>
<meta name="description" content="Checklists for setting a goal in your notebook and checking in on it every month.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1917'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --text: #1c1917;
  --muted: #78716c;
  --faint: #a8a29e;
  --line: #e7e5e4;
  --hover: #f5f5f4;
  --accent: #1c1917;
  --accent-text: #fafaf9;
  --key: #b45309;
  --danger: #b91c1c;
  --focus: #2563eb;
  --shadow: 0 1px 2px rgba(28,25,23,.04), 0 4px 16px rgba(28,25,23,.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0a09;
    --surface: #171412;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --faint: #6b625c;
    --line: #2a2522;
    --hover: #211d1a;
    --accent: #f5f5f4;
    --accent-text: #0c0a09;
    --key: #f59e0b;
    --danger: #f87171;
    --focus: #60a5fa;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0a09; --surface: #171412; --text: #f5f5f4; --muted: #a8a29e; --faint: #6b625c;
  --line: #2a2522; --hover: #211d1a; --accent: #f5f5f4; --accent-text: #0c0a09; --key: #f59e0b;
  --danger: #f87171; --focus: #60a5fa;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 16px; }
main { flex: 1; padding: 40px 0 56px; }

/* nav */
.crumbs { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; margin-bottom: 28px; font-size: 14px; color: var(--muted); }
.crumbs a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; max-width: 70%; }
.crumbs a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs a:hover { color: var(--text); }
.brand { font-weight: 600; color: var(--text); letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; }
.brand svg { width: 18px; height: 18px; }
.progress-meta { font-variant-numeric: tabular-nums; }

h1 { font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 28px; font-size: 15px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); text-decoration: none; font-size: 15px; font-weight: 500;
  transition: background .15s, border-color .15s, transform .1s;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.primary:hover { opacity: .88; }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 0 12px; }
.btn.ghost:hover { color: var(--text); background: var(--hover); }
.btn.danger:hover { color: var(--danger); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; align-items: center; }
.actions .spacer { flex: 1; }
.hint { font-size: 13px; color: var(--faint); margin-top: 14px; }
.legend-key { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--key); margin-right: 6px; position: relative; top: -1px; }

kbd {
  font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; background: var(--bg);
}
@media (hover: none) { kbd, .kbd-hint { display: none; } }

/* bullet glyphs */
.g { font: 600 .95em/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 1px; white-space: nowrap; }

/* home */
.group { margin: 28px 0 8px; font-size: 13px; color: var(--muted); }
.group:first-of-type { margin-top: 0; }
.lists { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lists li { border-bottom: 1px solid var(--line); }
.lists a { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-decoration: none; padding: 16px 4px; }
.lists .name { font-weight: 550; display: flex; align-items: center; gap: 8px; }
.lists .meta { font-size: 13px; color: var(--muted); grid-column: 1; }
.lists .side { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 10px; color: var(--faint); }
.lists .side svg { width: 14px; height: 14px; }
.lists a:hover .name span:first-child { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-text); }
.tag.soft { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.ring { width: 28px; height: 28px; flex: none; }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }

/* checklist */
.progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin: -16px 0 36px; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }
.phase { margin: 32px 0 10px; font-size: 13px; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
.phase:first-child { margin-top: 0; }
.phase b { font-weight: 600; color: var(--text); }
.check { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.check > li { border-bottom: 1px solid var(--line); }
.item {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 14px; align-items: start;
  padding: 14px 4px; border: 0; background: transparent; text-align: left; border-radius: 0;
  transition: background .15s;
}
.item:hover { background: var(--hover); }
.item:focus-visible { outline-offset: -2px; border-radius: 8px; }
.box {
  width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 1.5px solid var(--faint);
  display: inline-flex; align-items: center; justify-content: center; color: var(--accent-text);
  transition: background .15s, border-color .15s;
}
.box svg { width: 14px; height: 14px; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.item .t { font-weight: 550; display: block; }
.item .n { color: var(--faint); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; margin-right: 6px; }
.item .key { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--key); vertical-align: middle; margin-left: 8px; position: relative; top: -2px; }
.item .d { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.item .s { display: block; color: var(--faint); font-size: 13px; margin-top: 6px; }
.item.done .box { background: var(--accent); border-color: var(--accent); }
.item.done .box svg { opacity: 1; transform: none; }
.item.done .t { color: var(--muted); }
.item.done .tx { text-decoration: line-through; text-decoration-color: var(--faint); }
.item.done .d, .item.done .s { opacity: .6; }

.extra { padding: 0 4px 14px 44px; }
.toggle { background: none; border: 0; padding: 0; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.toggle:hover { color: var(--text); }
.toggle svg { width: 12px; height: 12px; transition: transform .15s; }
.toggle[aria-expanded="true"] svg { transform: rotate(90deg); }

.filtr { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 16px; box-shadow: var(--shadow); }
.filtr .step { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.filtr .step:last-of-type { border-bottom: 0; }
.filtr .k { color: var(--faint); font-variant-numeric: tabular-nums; }
.filtr p { margin: 0; }
.filtr p span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.verdict { border-top: 1px solid var(--line); padding: 10px 0 8px; font-size: 13px; color: var(--muted); }
.verdict b { color: var(--text); }

.qs { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.qs li { padding-left: 14px; position: relative; }
.qs li::before { content: "–"; position: absolute; left: 0; color: var(--faint); }

.spread { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); font-size: 13px; color: var(--muted); }
.spread > div { padding: 10px 14px; }
.spread > div + div { border-left: 1px solid var(--line); }
.spread b { display: block; color: var(--text); font-weight: 550; font-size: 14px; }
.spread.quad > div:nth-child(n+3) { border-top: 1px solid var(--line); }
.spread.quad > div:nth-child(3) { border-left: 0; }

.note {
  margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--hover);
  font-size: 14px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 10px;
}
.note b { color: var(--text); font-weight: 600; }

.finish { text-align: center; margin-top: 36px; padding: 28px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.finish h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
.finish p { margin: 0; color: var(--muted); font-size: 15px; }
.finish .actions { justify-content: center; margin-top: 20px; }
.anim { animation: in .22s ease; }
@keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* cheat sheet */
h2.sec { font-size: 18px; letter-spacing: -.01em; margin: 36px 0 4px; }
h2.sec + .lead { margin-bottom: 14px; }
.legenda { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.sym { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.sym .gl { font: 600 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.sym .gl.mark { color: var(--key); }
.sym small { display: block; color: var(--muted); font-size: 13px; }
.defs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.defs li { padding: 12px 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 15px; }
.defs li b { display: block; color: var(--text); font-weight: 550; }
.quote { margin: 36px 0 0; padding-left: 16px; border-left: 2px solid var(--line); color: var(--muted); font-size: 15px; }

/* history */
.hist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.hist .when { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

/* footer */
footer { padding: 24px 0 32px; font-size: 13px; color: var(--faint); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
footer button:hover { color: var(--text); }
footer a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
footer a:hover { color: var(--text); }
footer .links { display: flex; gap: 14px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: var(--accent); color: var(--accent-text); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  transition: opacity .2s, transform .2s; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  main { padding-top: 24px; }
  h1 { font-size: 24px; }
  .actions .btn { flex: 1; }
  .actions .spacer { display: none; }
  .qs, .legenda { grid-template-columns: 1fr; }
  .extra { padding-left: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* ---------- e-ink ----------
   For Kindle, Kobo, PocketBook, Boox and other e-paper readers. Turned on automatically
   when the browser looks like one, or with "E-ink mode" in the footer.
   Black on white, no grey text, no motion, no hover fills, bigger type and tap targets. */
:root.eink {
  --bg: #fff; --surface: #fff; --text: #000; --muted: #222; --faint: #444; --line: #333;
  --hover: #fff; --accent: #000; --accent-text: #fff; --key: #000; --danger: #000; --focus: #000;
  --shadow: none; color-scheme: light;
}
.eink *, .eink *::before, .eink *::after { animation: none !important; transition: none !important; }
/* fixed colours too: very old e-reader browsers (older Kindles) ignore var(--...) */
.eink body { background: #fff; color: #000; }
.eink .btn { background: #fff; color: #000; }
.eink .btn.primary, .eink .btn.primary:hover { background: #000; color: #fff; border-color: #000; }
.eink .box { color: #fff; }
.eink .item.done .box { background: #000; border-color: #000; }
.eink .progress span { background: #000; }
.eink .ring .fg, .eink .dial .fg { stroke: #000; }
.eink .tag { background: #000; color: #fff; }
.eink .lists, .eink .lists li, .eink .check, .eink .check > li, .eink .defs, .eink .defs li { border-color: #333; }
.eink .toast { background: #000; color: #fff; }
.eink body { font-size: 18px; line-height: 1.55; -webkit-font-smoothing: auto; }
.eink .wrap { max-width: 680px; padding: 0 20px; }
.eink :focus-visible { outline: 3px solid #000; }
.eink kbd, .eink .kbd-hint { display: none; }

/* type: nothing smaller than 16px, weight instead of grey for hierarchy */
.eink h1 { font-size: 30px; font-weight: 700; }
.eink h2.sec { font-size: 21px; }
.eink .lead, .eink .item .d, .eink .defs li, .eink .quote, .eink .finish p, .eink .recap,
.eink .helper .body, .eink .stage .task { font-size: 17px; }
.eink .crumbs, .eink .group, .eink .phase, .eink .lists .meta, .eink .item .s, .eink .item .n,
.eink .hint, .eink .toggle, .eink .helper .toggle, .eink .filtr .step, .eink .filtr p span, .eink .verdict,
.eink .qs, .eink .spread, .eink .spread b, .eink .note, .eink .sym small, .eink .hist, .eink footer,
.eink .field label, .eink .chip, .eink .dial .time small, .eink .toast { font-size: 16px; }
.eink .tag { font-size: 13px; }
.eink .group, .eink .phase { color: #000; font-weight: 600; }
.eink .item .t, .eink .lists .name, .eink .recap b, .eink .defs li b { font-weight: 650; }
.eink .item.done .t { color: #000; }
.eink .item.done .tx { text-decoration-color: #000; text-decoration-thickness: 2px; }
.eink .item.done .d, .eink .item.done .s { opacity: 1; }

/* tap targets: at least 44px, buttons ~52px */
.eink .btn {
  height: auto; min-height: 52px; padding: 10px 22px; border: 2px solid #000;
  font-size: 17px; font-weight: 600; white-space: normal;
}
.eink .btn:hover { background: var(--surface); }
.eink .btn.primary:hover { background: #000; opacity: 1; }
.eink .btn.ghost { border-color: transparent; color: #000; text-decoration: underline; text-underline-offset: 4px; }
.eink .btn.ghost:hover { background: transparent; }
.eink .btn:disabled { opacity: 1; border-style: dashed; color: #555; background: #fff; border-color: #555; }
.eink .actions { gap: 12px; }
.eink .crumbs { min-height: 44px; }
.eink .crumbs a, .eink footer a, .eink footer button { min-height: 44px; display: inline-flex; align-items: center; }
.eink .toggle { min-height: 44px; padding: 6px 0; color: #000; }
.eink .toggle svg { width: 14px; height: 14px; }
.eink .lists a { padding: 20px 4px; }
.eink .lists .side { color: #000; }
.eink .lists .side svg { width: 18px; height: 18px; }
.eink .lists a:hover .name span:first-child { text-decoration: none; }
.eink .item { padding: 18px 4px; grid-template-columns: 30px 1fr; }
.eink .item:hover { background: transparent; }
.eink .box { width: 28px; height: 28px; border: 2px solid #000; margin-top: -2px; }
.eink .box svg { width: 18px; height: 18px; }
.eink .extra { padding-left: 48px; }
.eink .item .key, .eink .legend-key { width: 9px; height: 9px; }
.eink .chip { min-height: 44px; padding: 8px 16px; border: 1.5px solid #000; color: #000; }
.eink .chip:hover { background: #fff; }
.eink .big { border: 2px solid #000; font-size: 19px; }
.eink .big::placeholder { color: #555; }
.eink footer { color: #000; }
.eink footer a, .eink footer button { text-decoration-color: #000; }
.eink footer .links { flex-wrap: wrap; gap: 0 20px; }
.eink footer .wrap { align-items: center; }
.eink .big:focus, .eink .big:focus-visible { outline: 0; border-width: 3px; }

/* tracks keep a light fill so the filled part still reads against them */
.eink .progress { height: 8px; background: #fff; border: 1.5px solid #000; border-radius: 4px; }
.eink .ring .bg, .eink .dial .bg { stroke: #bbb; }
.eink .dial .fg { stroke-linecap: butt; }
.eink .count { font-weight: 800; }

/* panels: a black outline instead of a grey fill or shadow */
.eink .note, .eink .helper .body .split { background: #fff; border: 1.5px solid #000; }
.eink .filtr, .eink .spread, .eink .finish { border: 1.5px solid #000; }
.eink .tag.soft { border-color: #000; color: #000; }
.eink .toast { border: 2px solid #fff; outline: 2px solid #000; }
@media (max-width: 560px) {
  .eink h1 { font-size: 26px; }
  .eink .extra { padding-left: 4px; }
}
</style>
<script>
/* E-ink mode: on by default on e-readers, switchable in the footer. One setting for all tools.
   Written for very old browsers too (older Kindles): no modern JS, and the footer switch is a
   plain link (?eink=1 / ?eink=0) that reloads the page, so it works even where click handlers
   or in-place restyling don't. The setting is kept in localStorage and in a cookie. */
(function () {
  var d = document.documentElement, ua = navigator.userAgent || '', K = 'notebook-tools:eink', pref = null, m;
  function mq(q) { try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch (e) { return false; } }
  try { pref = localStorage.getItem(K); } catch (e) {}
  if (pref !== '1' && pref !== '0') { m = /(?:^|;\s*)ntEink=([01])/.exec(document.cookie || ''); pref = m ? m[1] : null; }
  var reader = /Kindle|Kobo|PocketBook|tolino|BOOX|Onyx|Bookeen|Inkpalm|Meebook|Bigme/i.test(ua) && !/Silk/i.test(ua);
  var auto = reader || mq('(monochrome)') || mq('(update: slow)');
  var on = pref === '1' || (pref !== '0' && auto);
  m = /[?&]eink=(1|0|toggle)/.exec(location.search || '');
  if (m) {
    on = m[1] === 'toggle' ? !on : m[1] === '1';
    pref = on ? '1' : '0';
    try { localStorage.setItem(K, pref); } catch (e) {}
    try { document.cookie = 'ntEink=' + pref + '; path=/; expires=' + new Date(new Date().getTime() + 31536000000).toUTCString(); } catch (e) {}
    try { if (window.history && history.replaceState) history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  }
  if (on) d.className += ' eink';
})();
</script>
</head>
<body>
<main><div class="wrap" id="app"></div></main>
<footer>
  <div class="wrap">
    <span>Data stays in this browser</span>
    <span class="links">
      <a href="../index.html">All tools</a>
      <button type="button" data-act="export">Export</button>
      <button type="button" data-act="import">Import</button>
      <a id="eink-toggle" role="button" href="?eink=toggle">E-ink mode</a>
    </span>
  </div>
</footer>
<input type="file" id="file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- content ----------
     Review steps, written in our own words. {x} in text = a symbol from the legend. */

  const FILTER = 'filter';

  const C = {
    reviews: [
      {
        id: 'new', group: 'new', title: 'New goal', when: 'A fresh spread in your notebook', time: '15–20 min',
        sections: [
          {
            phase: ['A', 'Picture it'],
            items: [
              { t: 'Fresh spread', d: 'Next free spread in your notebook. Title: the goal in a few words. Add it to the index.', extra: 'layout', open: true },
              { t: 'Picture it done', d: 'On the left page, write a few lines about the day it’s real. Where are you, what do you see, what has changed? Don’t edit.', s: 'If it doesn’t make you want it a little, push it further.' },
            ],
          },
          {
            phase: ['B', 'Commit'],
            items: [
              { t: 'One sentence', d: 'At the top of the right page: the goal in one concrete sentence, with a date.', s: 'Concrete enough that you’ll know when it’s done.', key: true },
              { t: 'Why it matters', d: 'One line under it: why you want it.' },
              { t: 'Is it yours?', d: 'Say the sentence out loud. Notice the reaction: a spark, nothing, or a weight.', s: 'Nothing usually means too small: make it bigger. A weight usually means it’s someone else’s goal: rewrite it as your own, or drop it.', key: true },
            ],
          },
          {
            phase: ['C', 'Work it back'],
            items: [
              { t: 'Milestones', d: 'Ask what has to be true just before the finish, then just before that. Write three to five, then number them in the order you’ll reach them.' },
              { t: 'Next 30 days', d: 'One habit you control for the next 30 days, not a result. Write it with today’s date and the date 30 days from now.', s: 'Small enough that you’ll keep it on most days.', key: true },
              { t: 'Sign it', d: 'Date and sign the page. It’s a contract with yourself.' },
              { t: 'Dates', d: 'Put the goal’s date and the 30-day check-in in your future log or calendar ({<}).' },
              { t: 'Today', d: 'The smallest step towards it today, as a {*} task on today’s page. Then do it.', key: true, link: ['../start/index.html', 'Do it with Start'] },
            ],
          },
        ],
      },
      {
        id: 'checkin', group: 'regular', title: 'Check-in', when: 'Once a month, or when the 30 days are up', time: '5–10 min',
        sections: [
          {
            phase: ['A', 'Look back'],
            items: [
              { t: 'Reread', d: 'Open the goal’s spread and read all of it, the picture too.' },
              { t: 'Still yours?', d: 'Say the goal out loud again. A spark, nothing, or a weight?', s: 'Nothing or a weight: make it bigger, make it yours again, or let it go. Letting go of a goal that no longer fits is a decision, not a failure.', key: true },
              { t: 'Milestones', d: 'Tick off ({×}) the ones you’ve reached.' },
              { t: 'What moved', d: 'One line under the 30-day habit: what moved this month. Write down what you did, not what you didn’t.' },
            ],
          },
          {
            phase: ['B', 'Look ahead'],
            items: [
              { t: 'Next 30 days', d: 'Keep the habit, or change what didn’t work. Write the new block with its dates.', key: true },
              { t: 'Monthly list', d: 'Put the next steps on this month’s task list.' },
              { t: 'Dates', d: 'Next check-in in your future log or calendar ({<}).' },
              { t: 'Today', d: 'One small step for today, marked {*}.', key: true, link: ['../start/index.html', 'Do it with Start'] },
            ],
            notes: [['Reached it?', 'Write the date on the goal’s page and tick it off ({×}) in the index. Then picture the next one.']],
          },
        ],
      },
    ],
    extras: {
      layout: ['Spread layout', '<div class="spread"><div><b>Left · picture</b>the day it’s real</div><div><b>Right · contract</b>goal + date · why · milestones · 30 days · signature</div></div>'],
    },
  };

  /* ---------- UI strings ---------- */
  const T = {
      locale: 'en-GB', app: 'Goals',
      groups: { new: 'When you set a goal', regular: 'Regularly' },
      home: 'Where are you heading?', homeLead: 'A goal you actually want, written in your notebook and worked back to a step for today.',
      history: 'History', handy: 'Handy', cheat: 'Cheat sheet', cheatMeta: 'Symbols · filter · during the day · core collections',
      now: 'now', inProgress: (n, t) => `in progress · ${n} of ${t}`, steps: n => `${n} steps`,
      last: w => 'last ' + w, never: 'not done yet', streak: n => `${n} days in a row`,
      today: 'today', yesterday: 'yesterday', daysAgo: n => `${n} days ago`,
      back: 'Goals', started: w => 'started ' + w, keyStep: 'Key step',
      staleTitle: 'Yesterday?', stale: w => `These ticks are from ${w}.`, restart: 'Start over',
      done: 'Done', allDone: d => `All steps ticked off${d ? ' in ' + d : ''}.`, saveClose: 'Save and close',
      clear: 'Clear ticks', finishEarly: 'Finish early',
      hintKey: 'key step', hintKbd: '<kbd>X</kbd> ticks the next one · <kbd>Z</kbd> undo · <kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>Space</kbd> toggles',
      saved: t => `${t}: saved`, savedPart: (t, n, all) => `${t}: saved (${n} of ${all})`,
      histLead30: s => 'Last 30 days: ' + s, histEmpty: 'Nothing yet. Finished reviews will show up here.',
      extras: { filter: 'Filter', ...Object.fromEntries(Object.entries(C.extras).map(([k, [t]]) => [k, t])) },
      spread: [['Left · past week', 'reflection'], ['Right · coming week', 'tasks · intention · <span class="g">*</span>']],
      quad: [['What worked', 'how you work'], ['More of this', 'what’s good for me'], ['What didn’t work', 'how you work'], ['Less of this', 'what isn’t good for me']],
      filter: [
        ['<strong>Is it necessary?</strong> Would skipping it have serious consequences: work, bills, official matters?', 'Keep asking “why?” until you get to the heart of it. Choose actions you can influence, not outcomes. Yes → it stays. No → next.'],
        ['<strong>Does it matter</strong> to me or to the people close to me?', 'At work, if you don’t know why, ask. In private life, check whether an old idea still interests you. Yes → it stays. No or not sure → next.'],
        ['<strong>What happens if I never do it?</strong>', 'Nothing? Cross it out, no guilt. Something you care about suffers, like a relationship? Then the task makes sense.'],
        ['<strong>Rewrite it by hand.</strong> The last sieve.', 'Not worth a minute of rewriting? Let it go.'],
      ],
      verdict: '<b>Three “no”s</b> → cross it out. It stays → <span class="g">&gt;</span> rewrite only what you’ll do in this period.',
      cheatLead: 'What you come back to during reviews.',
      symbols: 'Symbols', symbolsLead: 'Short entries that start with a single sign',
      filterTitle: 'Filter', filterLead: 'For every open <span class="g">•</span>, at every review.',
      dayTitle: 'During the day', dayLead: 'Write it down right away',
      day: [
        ['Day page first', 'Briefly and straight away, without deciding where it belongs. The evening review moves dated things to the monthly list, future log or calendar.'],
        ['Recurring meetings', 'On the day page, just a <span class="g">○</span> with a pointer to the page. The notes themselves go into a separate collection, dated.'],
        ['Events <span class="g">○</span>', 'Facts, no judgement. Thoughts and feelings as <span class="g">–</span>, indented underneath.'],
      ],
      coreTitle: 'Core collections', coreLead: 'What lives where',
      core: [
        ['Index', 'At the front of the notebook. Collection name and page numbers. Add later parts next to them. Day pages don’t get indexed.'],
        ['Future log', 'The next few months on one spread. Everything with a date outside the current month goes here.'],
        ['Monthly log', 'Left page: timeline, filled in after the fact. Right page: tasks from the future log, from last month and new ones.'],
        ['Weekly log', 'Left page: reflection on the past week. Right page: tasks for the coming week.'],
        ['Day page', 'Date and page number. Takes as much space as it needs. Nothing gets set up in advance.'],
      ],
      quote: 'Every review asks the same questions, but the answers change over time. That’s why you keep coming back to them.',
      file: 'goals',
      saveErr: 'Could not save data in this browser',
      imported: n => `Imported ${n} history entries`, badFile: 'Not a valid export file',
  };

  const glyphs = s => s.replace(/\{(.+?)\}/g, '<span class="g">$1</span>');
  const TOTAL = r => r.sections.reduce((n, s) => n + s.items.length, 0);
  const byId = id => C.reviews.find(r => r.id === id);

  /* ---------- storage ---------- */
  const KEY = 'goals-checklists.v1';
  const LEGACY_KEYS = [];
  let db = load();

  function load() {
    try {
      const raw = [KEY, ...LEGACY_KEYS].map(k => localStorage.getItem(k)).find(Boolean);
      const d = JSON.parse(raw);
      if (d && d.progress && Array.isArray(d.log)) return d;
    } catch (e) {}
    return { progress: {}, log: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast(T.saveErr); }
  }

  const $ = s => document.querySelector(s);

  /* ---------- dates ---------- */
  const DAY = 864e5;
  const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const daysAgo = t => Math.round((startOfDay(Date.now()) - startOfDay(t)) / DAY);
  const hm = t => new Date(t).toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
  function fmtWhen(t) {
    const n = daysAgo(t);
    if (n === 0) return T.today + ', ' + hm(t);
    if (n === 1) return T.yesterday + ', ' + hm(t);
    if (n < 7) return T.daysAgo(n);
    const d = new Date(t);
    return d.toLocaleDateString(T.locale, { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function fmtDur(ms) {
    const m = Math.round(ms / 6e4);
    if (m < 1) return '< 1 min';
    if (m < 90) return `${m} min`;
    return `${Math.floor(m / 60)} h ${m % 60} min`;
  }
  const lastDone = id => db.log.filter(e => e.id === id).reduce((a, e) => Math.max(a, e.t), 0);

  // Which checklist makes sense right now? A hint, not a rule.
  function due(r) {
    const last = lastDone(r.id), now = new Date(), h = now.getHours();
    const doneToday = last && daysAgo(last) === 0;
    if (r.id === 'checkin') { const l = Math.max(lastDone('checkin'), lastDone('new')); return !!l && daysAgo(l) >= 28; }
    if (r.id === 'morning') return !doneToday && h >= 4 && h < 14;
    if (r.id === 'evening') return !doneToday && (h >= 18 || h < 2);
    if (r.id === 'week') return !last || daysAgo(last) >= 7;
    if (r.id === 'month') {
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const edge = now.getDate() >= lastDay - 2 || now.getDate() <= 3;
      return edge && (!last || daysAgo(last) >= 10);
    }
    return false;
  }

  // Streak for daily reviews: consecutive days (ending today or yesterday).
  function streak(id) {
    const days = new Set(db.log.filter(e => e.id === id).map(e => daysAgo(e.t)));
    const start = days.has(0) ? 0 : days.has(1) ? 1 : -1;
    if (start < 0) return 0;
    let n = 0;
    while (days.has(start + n)) n++;
    return n;
  }

  /* ---------- routing ---------- */
  function route() {
    const p = location.hash.replace(/^#\/?/, '').split('/');
    if (p[0] === 'r' && byId(p[1])) return { view: 'review', review: byId(p[1]) };
    if (p[0] === 'cheat' || p[0] === 'sciaga') return { view: 'cheat' };
    if (p[0] === 'history' || p[0] === 'historia') return { view: 'history' };
    return { view: 'home' };
  }

  /* ---------- ui ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  const ICON_BACK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>';
  const ICON_NEXT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const LOGO = '<svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8.2 7.7l3.6 3.6M11.8 7.7l-3.6 3.6" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/><rect x="14" y="8" width="10" height="3" rx="1.5" fill="var(--bg)"/><circle cx="10" cy="16" r="1.9" fill="var(--bg)" opacity=".7"/><rect x="14" y="14.5" width="8" height="3" rx="1.5" fill="var(--bg)" opacity=".7"/><circle cx="10" cy="22.5" r="1.9" fill="var(--bg)" opacity=".45"/><rect x="14" y="21" width="5" height="3" rx="1.5" fill="var(--bg)" opacity=".45"/></svg>';

  function ring(done, total) {
    const r = 11, c = 2 * Math.PI * r, f = total ? done / total : 0;
    return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="bg" cx="14" cy="14" r="${r}"/><circle class="fg" cx="14" cy="14" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>`;
  }

  const app = $('#app');
  const openExtras = new Set();

  function render(opts = {}) {
    const rt = route();
    document.title = rt.review ? `${rt.review.title} · ${T.app}` : T.app;
    if (rt.view === 'review') renderReview(rt.review, opts);
    else if (rt.view === 'cheat') renderCheat();
    else if (rt.view === 'history') renderHistory();
    else renderHome();
  }

  function renderHome() {
    const groups = [...new Set(C.reviews.map(r => r.group))];
    const row = r => {
      const p = db.progress[r.id], total = TOTAL(r);
      const n = p ? p.done.length : 0;
      const last = lastDone(r.id);
      const st = r.group === 'daily' ? streak(r.id) : 0;
      const bits = [];
      if (p && n) bits.push(T.inProgress(n, total));
      else bits.push(T.steps(total) + (r.time ? ` · ${r.time}` : ''));
      bits.push(last ? T.last(fmtWhen(last)) : T.never);
      if (st > 1) bits.push(T.streak(st));
      return `
        <li><a href="#/r/${r.id}">
          <span class="name"><span>${r.title}</span>${due(r) && !(p && n) ? `<span class="tag">${T.now}</span>` : ''}</span>
          <span class="meta">${bits.join(' · ')}</span>
          <span class="side">${p && n ? ring(n, total) : ''}${ICON_NEXT}</span>
        </a></li>`;
    };
    app.innerHTML = `
      <div class="crumbs"><a href="../index.html">${ICON_BACK}<span>All tools</span></a><a href="#/history">${T.history}</a></div>
      <h1>${T.home}</h1>
      <p class="lead">${T.homeLead}</p>
      ${groups.map(g => `
        <p class="group">${T.groups[g]}</p>
        <ul class="lists">${C.reviews.filter(r => r.group === g).map(row).join('')}</ul>`).join('')}`;
  }

  function filterHtml() {
    return `
      <div class="filtr">
        ${T.filter.map(([q, s], i) => `<div class="step"><span class="k">${i + 1}</span><p>${q}<span>${s}</span></p></div>`).join('')}
        <div class="verdict">${T.verdict}</div>
      </div>`;
  }
  const cells = (rows, cls) => `<div class="spread${cls ? ' ' + cls : ''}">${rows.map(([b, s]) => `<div><b>${b}</b>${s}</div>`).join('')}</div>`;
  const EXTRAS = {
    [FILTER]: filterHtml,
    qs: () => `<ul class="qs">${C.monthQs.map(q => `<li>${q}</li>`).join('')}</ul>`,
    spread: () => cells(T.spread),
    quad: () => cells(T.quad, 'quad'),
    ...Object.fromEntries(Object.entries(C.extras).map(([k, [, h]]) => [k, () => h])),
  };

  function renderReview(r, opts) {
    const p = db.progress[r.id];
    const done = new Set(p ? p.done : []);
    const total = TOTAL(r), n = done.size;
    const pct = Math.round(n / total * 100);
    let idx = 0;
    const stale = p && p.started && daysAgo(p.started) > 0 && r.group === 'daily' && n > 0;

    const sections = r.sections.map((s, si) => `
      ${s.phase ? `<p class="phase"><b>${s.phase[0]}</b>${s.phase[1]}</p>` : ''}
      <ol class="check">
        ${s.items.map((it, ii) => {
          const k = `${si}.${ii}`, num = ++idx, on = done.has(k);
          const exKey = `${r.id}:${k}`;
          const ex = it.extra && EXTRAS[it.extra];
          const open = ex && (openExtras.has(exKey) || (it.open && !openExtras.has('!' + exKey)));
          return `
          <li>
            <button class="item ${on ? 'done' : ''}" data-act="tick" data-k="${k}" role="checkbox" aria-checked="${on}">
              <span class="box">${ICON_CHECK}</span>
              <span>
                <span class="t"><span class="n">${num}</span><span class="tx">${glyphs(it.t)}</span>${it.key ? `<span class="key" title="${T.keyStep}"></span>` : ''}</span>
                <span class="d">${glyphs(it.d)}</span>
                ${it.s ? `<span class="s">${glyphs(it.s)}</span>` : ''}
              </span>
            </button>
            ${it.link ? `<div class="extra"><a class="toggle" href="${it.link[0]}">${ICON_NEXT}${it.link[1]}</a></div>` : ''}
            ${ex ? `<div class="extra">
              <button class="toggle" data-act="extra" data-x="${exKey}" data-default="${it.open ? 1 : 0}" aria-expanded="${open}">${ICON_NEXT}${T.extras[it.extra]}</button>
              ${open ? ex() : ''}
            </div>` : ''}
          </li>`;
        }).join('')}
      </ol>
      ${(s.notes || []).map(([b, t]) => `<div class="note"><b>${b}</b><span>${t}</span></div>`).join('')}`).join('');

    app.innerHTML = `
      <div class="crumbs">
        <a href="#/">${ICON_BACK}<span>${T.back}</span></a>
        <span class="progress-meta">${n} / ${total}</span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>
      <h1>${r.title}</h1>
      <p class="lead">${r.when}${r.time ? ' · ' + r.time : ''}${p && n && p.started ? ' · ' + T.started(fmtWhen(p.started)) : ''}</p>
      ${stale ? `<div class="note" style="margin:-12px 0 24px"><b>${T.staleTitle}</b><span>${T.stale(fmtWhen(p.started))} <button class="toggle" style="text-decoration:underline;text-underline-offset:3px" data-act="restart">${T.restart}</button></span></div>` : ''}
      ${sections}
      ${n === total ? `
        <div class="finish ${opts.anim ? 'anim' : ''}" id="finish">
          <h2>${T.done}</h2>
          <p>${T.allDone(p && p.started ? fmtDur(Date.now() - p.started) : '')}</p>
          <div class="actions"><button class="btn primary" data-act="complete">${T.saveClose}</button></div>
        </div>` : `
        <div class="actions">
          ${n ? `<button class="btn ghost danger" data-act="restart">${T.clear}</button>` : ''}
          <span class="spacer"></span>
          ${n ? `<button class="btn" data-act="complete">${T.finishEarly}</button>` : ''}
        </div>
        <p class="hint"><span class="legend-key"></span>${T.hintKey}<span class="kbd-hint"> · ${T.hintKbd}</span></p>`}`;

    if (opts.focus) app.querySelector(`[data-k="${opts.focus}"]`)?.focus({ preventScroll: true });
  }

  function renderCheat() {
    const defs = rows => `<ul class="defs">${rows.map(([b, s]) => `<li><b>${b}</b>${s}</li>`).join('')}</ul>`;
    app.innerHTML = `
      <div class="crumbs"><a href="#/">${ICON_BACK}<span>${T.back}</span></a></div>
      <h1>${T.cheat}</h1>
      <p class="lead">${T.cheatLead}</p>

      <h2 class="sec">${T.symbols}</h2>
      <p class="lead">${T.symbolsLead}</p>
      <div class="legenda">
        ${C.legend.map(([g, n, s, mark]) => `<div class="sym"><span class="gl${mark ? ' mark' : ''}">${g}</span><span>${n}<small>${s}</small></span></div>`).join('')}
      </div>

      <h2 class="sec">${T.filterTitle}</h2>
      <p class="lead">${T.filterLead}</p>
      ${filterHtml()}

      <h2 class="sec">${T.dayTitle}</h2>
      <p class="lead">${T.dayLead}</p>
      ${defs(T.day)}

      <h2 class="sec">${T.coreTitle}</h2>
      <p class="lead">${T.coreLead}</p>
      ${defs(T.core)}

      <p class="quote">${T.quote}</p>`;
  }

  function renderHistory() {
    const items = [...db.log].sort((a, b) => b.t - a.t).slice(0, 60);
    const since = Date.now() - 30 * DAY;
    const counts = C.reviews.map(r => [r, db.log.filter(e => e.id === r.id && e.t >= since).length]);
    app.innerHTML = `
      <div class="crumbs"><a href="#/">${ICON_BACK}<span>${T.back}</span></a></div>
      <h1>${T.history}</h1>
      <p class="lead">${db.log.length
        ? T.histLead30(counts.filter(c => c[1]).map(([r, c]) => `${r.title.toLowerCase()} ${c}×`).join(' · '))
        : T.histEmpty}</p>
      ${items.length ? `<ul class="hist">${items.map(e => {
        const r = byId(e.id);
        const part = e.n < e.total ? ` · ${e.n}/${e.total}` : '';
        return `<li><span>${r ? r.title : e.id}${part}</span><span class="when">${fmtWhen(e.t)}${e.dur ? ' · ' + fmtDur(e.dur) : ''}</span></li>`;
      }).join('')}</ul>` : ''}`;
  }

  /* ---------- actions ---------- */
  const current = () => route().review;
  let lastTicked = [];

  function tick(r, k, force) {
    let p = db.progress[r.id];
    if (!p) p = db.progress[r.id] = { started: Date.now(), done: [] };
    const has = p.done.includes(k);
    const want = force === undefined ? !has : force;
    if (want === has) return;
    if (want) { p.done.push(k); lastTicked.push(k); }
    else p.done = p.done.filter(x => x !== k);
    if (!p.done.length) delete db.progress[r.id];
    save();
    const wasLast = want && db.progress[r.id] && db.progress[r.id].done.length === TOTAL(r);
    render({ focus: k, anim: wasLast });
    if (wasLast) $('#finish')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function keysOf(r) {
    const out = [];
    r.sections.forEach((s, si) => s.items.forEach((_, ii) => out.push(`${si}.${ii}`)));
    return out;
  }

  function complete(r) {
    const p = db.progress[r.id];
    const n = p ? p.done.length : 0, all = TOTAL(r);
    db.log.push({ id: r.id, t: Date.now(), dur: p && p.started ? Date.now() - p.started : 0, n, total: all });
    delete db.progress[r.id];
    lastTicked = [];
    save();
    location.hash = '#/';
    toast(n === all ? T.saved(r.title) : T.savedPart(r.title, n, all));
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, r = current();

    if (act === 'tick' && r) tick(r, el.dataset.k);
    else if (act === 'extra') {
      const x = el.dataset.x, def = el.dataset.default === '1';
      if (def) { openExtras.has('!' + x) ? openExtras.delete('!' + x) : openExtras.add('!' + x); }
      else { openExtras.has(x) ? openExtras.delete(x) : openExtras.add(x); }
      render();
      app.querySelector(`[data-x="${x}"]`)?.focus({ preventScroll: true });
    }
    else if (act === 'restart' && r) {
      delete db.progress[r.id]; lastTicked = []; save(); render(); window.scrollTo(0, 0);
    }
    else if (act === 'complete' && r) complete(r);
    else if (act === 'export') {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${T.file}-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    else if (act === 'import') $('#file').click();
  });

  $('#file').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.log) || typeof data.progress !== 'object') throw 0;
      const seen = new Set(db.log.map(x => x.id + '@' + x.t));
      let added = 0;
      for (const x of data.log) {
        if (!x || !x.id || !x.t || seen.has(x.id + '@' + x.t)) continue;
        db.log.push(x); added++;
      }
      for (const [id, p] of Object.entries(data.progress || {})) {
        if (byId(id) && p && Array.isArray(p.done) && !db.progress[id]) db.progress[id] = p;
      }
      save(); render();
      toast(T.imported(added));
    } catch (_) { toast(T.badFile); }
  });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const r = current();
    if (!r) return;
    const keys = keysOf(r);
    const items = [...app.querySelectorAll('.item')];
    const at = items.indexOf(document.activeElement);

    if (e.key === 'x' || e.key === 'X') {
      e.preventDefault();
      const p = db.progress[r.id], done = new Set(p ? p.done : []);
      const from = at >= 0 && !done.has(keys[at]) ? at : 0;
      const k = keys.slice(from).find(x => !done.has(x)) || keys.find(x => !done.has(x));
      if (k) tick(r, k, true);
    }
    else if (e.key === 'z' || e.key === 'Z') {
      e.preventDefault();
      const p = db.progress[r.id];
      while (lastTicked.length) {
        const k = lastTicked.pop();
        if (p && p.done.includes(k)) { tick(r, k, false); return; }
      }
    }
    else if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault();
      (items[at + 1] || items[at < 0 ? 0 : at])?.focus();
    }
    else if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault();
      (items[at - 1] || items[0])?.focus();
    }
  });

  window.addEventListener('storage', e => {
    if (e.key === KEY) { db = load(); render(); }
  });
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
<script>
(function () {
  var a = document.getElementById('eink-toggle');
  if (!a) return;
  var on = /(^|\s)eink(\s|$)/.test(document.documentElement.className);
  a.innerHTML = on ? 'E-ink mode: on' : 'E-ink mode: off';
  a.href = '?eink=' + (on ? '0' : '1') + (location.hash || '');
  a.setAttribute('aria-pressed', on ? 'true' : 'false');
})();
</script>
</body>
</html>
